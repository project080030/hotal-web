<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel & Tour Management System</title>
  
  <!-- Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-hotel brand-icon"></i>
      <span class="brand-title">Hotel & Tour <strong>System</strong></span>
    </div>
    
    <div class="nav-links">
      <button class="nav-btn active"><i class="fa-solid fa-database"></i> จัดการข้อมูล (ทุกตาราง)</button>
      <button class="nav-btn"><i class="fa-solid fa-chart-line"></i> รายงานสรุป (6 Views)</button>
      <button class="nav-btn ai-btn"><i class="fa-solid fa-robot"></i> AI ผู้ช่วยข้อมูล</button>
    </div>

    <div class="nav-user">
      <span class="user-email"><i class="fa-solid fa-circle-user"></i> admin@hotal.com</span>
      <button class="btn-logout" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="hero-banner">
    <div class="hero-container">
      <h1>Hotel & Tour Management System</h1>
      <p>ระบบบริหารจัดการห้องพัก และการท่องเที่ยวแบบครบวงจรระดับองค์กร (Apex Hotel)</p>
    </div>
  </section>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- CARD 1: DYNAMIC FORM CRUD -->
    <div class="card agoda-card">
      <div class="card-header">
        <div class="title-group">
          <div class="icon-box"><i class="fa-solid fa-sliders"></i></div>
          <div>
            <h2>จัดการข้อมูล (CRUD ทุกตาราง)</h2>
            <p class="subtitle">เลือกตารางด้านขวาเพื่อจัดการข้อมูลและสร้างฟอร์มอัตโนมัติ</p>
          </div>
        </div>

        <div class="select-box">
          <label for="table-select"><i class="fa-solid fa-table-cells"></i> ตารางข้อมูล:</label>
          <select id="table-select" class="custom-select">
            <option value="rooms">rooms (ห้องพัก)</option>
            <option value="room_types">room_types (ประเภทห้อง)</option>
            <option value="room_bookings">room_bookings (การจองห้อง)</option>
            <option value="customers">customers (ผู้เข้าพัก/ลูกค้า)</option>
            <option value="tour_packages">tour_packages (แพ็กเกจทัวร์)</option>
            <option value="tour_bookings">tour_bookings (การจองทัวร์)</option>
          </select>
        </div>
      </div>

      <!-- FORM FIELDS (จะสร้างช่องกรอกอัตโนมัติผ่าน JS) -->
      <form id="crud-form" onsubmit="return false;">
        <div class="form-grid" id="form-fields">
          <!-- Dynamic Input Fields Rendered Here -->
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn-agoda-primary"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูลใหม่</button>
          <button type="reset" id="btn-cancel" class="btn-agoda-secondary"><i class="fa-solid fa-xmark"></i> ยกเลิกการแก้ไข</button>
        </div>
      </form>
    </div>

    <!-- CARD 2: DYNAMIC TABLE DATA -->
    <div class="card agoda-card">
      <div class="card-header">
        <div class="title-group">
          <div class="icon-box alt"><i class="fa-solid fa-list-check"></i></div>
          <div>
            <h2>ข้อมูลในตาราง: <span id="current-table-title" style="color: var(--agoda-blue);">rooms</span></h2>
            <span class="badge-sub">(แสดง 20 แถวล่าสุด)</span>
          </div>
        </div>
        <button id="btn-refresh" class="btn-refresh"><i class="fa-solid fa-rotate-right"></i> รีเฟรชข้อมูล</button>
      </div>

      <div class="table-responsive">
        <table class="agoda-table" id="data-table">
          <thead>
            <tr>
              <!-- หัวตารางจะเปลี่ยนตามคอลัมน์จริงอัตโนมัติ -->
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- ข้อมูลจะถูกดึงใส่ที่นี่อัตโนมัติ -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
