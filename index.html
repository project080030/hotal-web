<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel & Tour System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header style="background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #3b82f6;">
    <div style="font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
      🏨 Hotel & Tour System
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <button id="btn-tab-crud" style="padding: 0.5rem 1rem; background: #2563eb; color: white; border: none; border-radius: 20px; cursor: pointer; font-family: inherit;">จัดการข้อมูล (ทุกตาราง)</button>
      <button id="btn-tab-report" style="padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 20px; cursor: pointer; font-family: inherit;">รายงานสรุป (6 Views)</button>
      <button id="btn-tab-ai" style="padding: 0.5rem 1rem; background: #8b5cf6; color: white; border: none; border-radius: 20px; cursor: pointer; font-family: inherit;">🤖 AI ผู้ช่วยข้อมูล</button>
      <span id="user-email" style="font-size: 0.9rem; color: #e2e8f0; margin-left: 0.5rem;">admin@hotal.com</span>
      <button id="btn-logout" style="padding: 0.5rem 1rem; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit;">ออกจากระบบ</button>
    </div>
  </header>

  <!-- HERO TITLE BANNER -->
  <section style="background: linear-gradient(135deg, #0284c7 0%, #3b82f6 50%, #06b6d4 100%); color: white; text-align: center; padding: 3rem 1rem 4rem 1rem;">
    <h1 style="font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem;">Hotel & Tour Management System</h1>
    <p style="font-size: 1.05rem; opacity: 0.95; font-weight: 300;">ระบบบริหารจัดการห้องพัก และการท่องเที่ยวแบบครบวงจร</p>
  </section>

  <!-- MAIN CONTENT CONTAINER -->
  <main style="max-width: 1200px; margin: -40px auto 3rem auto; padding: 0 1.5rem; position: relative; z-index: 10;">
    
    <!-- CARD 1: FORM CRUD -->
    <div style="background: #ffffff; border-radius: 16px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; margin-bottom: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0;">
        <h2 style="font-size: 1.25rem; color: #0f172a; font-weight: 600;">จัดการข้อมูล (CRUD ทุกตาราง)</h2>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <label for="table-select" style="font-size: 0.85rem; color: #64748b; font-weight: 500;">ตาราง:</label>
          <select id="table-select" style="padding: 0.5rem 0.85rem; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; outline: none;">
            <option value="rooms">rooms (ห้องพัก)</option>
            <option value="room_types">room_types (ประเภทห้อง)</option>
            <option value="bookings">bookings (การจอง)</option>
            <option value="guests">guests (ผู้เข้าพัก)</option>
          </select>
        </div>
      </div>

      <!-- FORM FIELDS (คงชื่อ ID ดั้งเดิมไว้อย่างครบถ้วน) -->
      <form id="crud-form" onsubmit="return false;">
        <div id="form-fields" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div>
            <label style="font-size: 0.85rem; color: #64748b; font-weight: 500; display: block; margin-bottom: 0.35rem;">room_number</label>
            <input type="text" id="room_number" placeholder="กรอกค่า room_number" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
          </div>
          <div>
            <label style="font-size: 0.85rem; color: #64748b; font-weight: 500; display: block; margin-bottom: 0.35rem;">room_type_id</label>
            <input type="text" id="room_type_id" placeholder="กรอกค่า room_type_id" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
          </div>
          <div>
            <label style="font-size: 0.85rem; color: #64748b; font-weight: 500; display: block; margin-bottom: 0.35rem;">status</label>
            <input type="text" id="status" placeholder="กรอกค่า status" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
          </div>
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <button type="submit" id="btn-submit" style="padding: 0.65rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-family: inherit;">+ เพิ่มข้อมูลใหม่</button>
          <button type="button" id="btn-cancel" style="padding: 0.65rem 1.5rem; background: #94a3b8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-family: inherit;">✕ ยกเลิกการแก้ไข</button>
        </div>
      </form>
    </div>

    <!-- CARD 2: ENTERPRISE DATA TABLE -->
    <div style="background: #ffffff; border-radius: 16px; padding: 1.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 style="font-size: 1.15rem; color: #0f172a; font-weight: 600;">ข้อมูลในตาราง: <span id="current-table-title" style="color: #2563eb;">rooms</span> <span style="font-size: 0.85rem; color: #64748b; font-weight: normal;">(แสดง 20 แถวล่าสุด)</span></h3>
        <button id="btn-refresh" style="padding: 0.55rem 1.25rem; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-family: inherit;">🔄 รีเฟรชข้อมูล</button>
      </div>

      <div style="width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0;">
        <table id="data-table" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
          <thead>
            <tr style="background: #f8fafc; color: #64748b; font-weight: 600; border-bottom: 2px solid #e2e8f0;">
              <th style="padding: 0.85rem 1rem;">จัดการ</th>
              <th style="padding: 0.85rem 1rem;">ROOM_ID</th>
              <th style="padding: 0.85rem 1rem;">ROOM_NUMBER</th>
              <th style="padding: 0.85rem 1rem;">ROOM_TYPE_ID</th>
              <th style="padding: 0.85rem 1rem;">STATUS</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- ข้อมูลจะถูกดึงมาจาก app.js สคริปต์เดิมตามปกติ -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
