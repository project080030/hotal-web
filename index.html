<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel & Tour Management System</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-hotel brand-icon"></i>
      <span class="brand-title">Hotel & Tour <strong>System</strong></span>
    </div>
    
    <div class="nav-links">
      <button class="nav-btn active"><i class="fa-solid fa-database"></i> จัดการข้อมูล (ทุกตาราง)</button>
      <button class="nav-btn"><i class="fa-solid fa-chart-line"></i> รายงานสรุป (6 Views)</button>
      <button class="nav-btn ai-btn"><i class="fa-solid fa-robot"></i> AI ผู้ช่วยข้อมูล</button>
    </div>

    <div class="nav-user">
      <span class="user-email"><i class="fa-solid fa-circle-user"></i> admin@hotal.com</span>
      <button class="btn-logout" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="hero-banner">
    <div class="hero-container">
      <h1>Hotel & Tour Management System</h1>
      <p>ระบบบริหารจัดการห้องพัก และการท่องเที่ยวแบบครบวงจรระดับองค์กร</p>
    </div>
  </section>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- CARD 1: FORM CRUD -->
    <div class="card agoda-card">
      <div class="card-header">
        <div class="title-group">
          <div class="icon-box"><i class="fa-solid fa-sliders"></i></div>
          <div>
            <h2>จัดการข้อมูล (CRUD ทุกตาราง)</h2>
            <p class="subtitle">เลือกตารางด้านขวาเพื่อจัดการข้อมูลในระบบ</p>
          </div>
        </div>

        <div class="select-box">
          <label for="table-select"><i class="fa-solid fa-table-cells"></i> ตารางข้อมูล:</label>
          <select id="table-select" class="custom-select">
            <option value="rooms">rooms (ห้องพัก)</option>
            <option value="room_types">room_types (ประเภทห้อง)</option>
            <option value="bookings">bookings (การจอง)</option>
            <option value="guests">guests (ผู้เข้าพัก)</option>
          </select>
        </div>
      </div>

      <!-- FORM FIELDS -->
      <form id="crud-form" onsubmit="return false;">
        <div class="form-grid">
          <div class="form-group">
            <label for="room_number">ROOM_NUMBER</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-door-closed input-icon"></i>
              <input type="text" id="room_number" placeholder="กรอกค่า room_number" autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="room_type_id">ROOM_TYPE_ID</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-key input-icon"></i>
              <input type="text" id="room_type_id" placeholder="กรอกค่า room_type_id" autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="status">STATUS</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-circle-check input-icon"></i>
              <input type="text" id="status" placeholder="กรอกค่า status" autocomplete="off">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn-agoda-primary"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูลใหม่</button>
          <button type="reset" id="btn-cancel" class="btn-agoda-secondary"><i class="fa-solid fa-xmark"></i> ยกเลิกการแก้ไข</button>
        </div>
      </form>
    </div>

    <!-- CARD 2: TABLE DATA -->
    <div class="card agoda-card">
      <div class="card-header">
        <div class="title-group">
          <div class="icon-box alt"><i class="fa-solid fa-list-check"></i></div>
          <div>
            <h2>ข้อมูลในตาราง: <span id="current-table-title">rooms</span></h2>
            <span class="badge-sub">(แสดง 20 แถวล่าสุด)</span>
          </div>
        </div>
        <button id="btn-refresh" class="btn-refresh"><i class="fa-solid fa-rotate-right"></i> รีเฟรชข้อมูล</button>
      </div>

      <div class="table-responsive">
        <table class="agoda-table" id="data-table">
          <thead>
            <tr>
              <th style="width: 140px; text-align: center;">จัดการ</th>
              <th>ROOM_ID</th>
              <th>ROOM_NUMBER</th>
              <th>ROOM_TYPE_ID</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- ข้อมูลจะถูกโหลดใส่ตรงนี้ผ่าน app.js -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
